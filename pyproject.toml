[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-power"
version = "0.1.0"
description = "Runnable pytest lessons with an in-memory SDN lab and mock objects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pytest>=8.3,<10"]

[project.optional-dependencies]
plugins = [
  "pytest-xdist>=3.6,<4",
  "pytest-rerunfailures>=14,<17",
  "pytest-timeout>=2.3,<3",
  "pytest-order>=1.3,<2",
  "pytest-dependency>=0.6,<0.7",
  "pytest-mock>=3.14,<4",
  "pytest-httpx>=0.35,<1",
  "httpx>=0.27,<1",
  "responses>=0.25,<1",
  "requests>=2.32,<3",
  "pytest-cov>=6,<8",
  "allure-pytest>=2.13,<3",
  "pytest-html>=4.1,<5",
  "pytest-asyncio>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
  "smoke: fast checks, placed first by our collection hook",
  "regression: detailed behavioral checks",
  "sdn: software-defined networking examples",
  "slow: illustrative category; no real waiting",
  "hardware: simulated device check, opt in with --run-hardware",
  "diagnostic_demo: deliberate failure, opt in with --run-diagnostics",
  "serial: ordered stateful workflow, excluded from xdist runs",
  "backend(name): choose a mock controller fixture at runtime",
  "asyncio: optional pytest-asyncio example",
  "flaky: optional pytest-rerunfailures example",
  "timeout: optional pytest-timeout deadline",
  "order: optional pytest-order sequence",
  "dependency: optional pytest-dependency prerequisite",
]

[tool.coverage.run]
source = ["pytest_power"]
branch = true

[tool.coverage.report]
show_missing = true
